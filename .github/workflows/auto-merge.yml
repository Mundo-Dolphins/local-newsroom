name: Auto-merge dependency PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'dependabot-preview[bot]' ||
      github.event.pull_request.user.login == 'renovate[bot]' ||
      (github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.event.pull_request.head.ref, 'renovate/'))
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # gh CLI is preinstalled on the ubuntu-latest runner (authenticated via GH_TOKEN)

      - name: Analyze PR and update branch if needed
        id: analyze
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          PR="$PR_NUMBER"
          
          echo "gh version: $(gh --version | head -1)"
          echo "=== Fetching PR $PR state ==="
          
          # Only long-stable --json fields: the preinstalled gh on the runner is
          # older than the one previously installed via apt, so newer fields
          # (baselineCommit, commitHeadline, commitsBeforeMergeBase, databaseId)
          # must not be requested - older versions reject them outright.
          PR_DATA=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,mergeable,headRefName,baseRefName,url --jq '.')
          
          STATE=$(echo "$PR_DATA" | jq -r '.state')
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.headRefName')
          BASE_REF=$(echo "$PR_DATA" | jq -r '.baseRefName')
          
          echo "PR State: $STATE"
          echo "Mergeable: $MERGEABLE (enum: MERGEABLE|CONFLICTING|UNKNOWN)"
          echo "Head: $HEAD_REF"
          echo "Base: $BASE_REF"
          
          # Detect staleness via the REST compare API (works on any gh version):
          # behind_by = commits in the base branch that are not in the PR head.
          # Branch names are used (not OIDs) so GitHub resolves live branch tips
          # server-side; the PR's recorded baseRefOid can lag behind the real base.
          COMMITS_BEHIND=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_REF...$HEAD_REF" --jq '.behind_by' 2>/dev/null || echo 0)
          echo "Commits behind: ${COMMITS_BEHIND:-0}"
          
          # State machine. Note: gh outputs the mergeable *enum*, not a boolean.
          # - CURRENT:     mergeable and up to date           -> enable auto-merge
          # - BEHIND:      mergeable (or pending) but stale   -> rebase branch
          # - CONFLICTING: merge conflicts                    -> ask bot to rebase
          # - UNKNOWN:     mergeability pending, up to date   -> skip
          if [ "$MERGEABLE" = "MERGEABLE" ] || [ "$MERGEABLE" = "UNKNOWN" ]; then
            if [ "${COMMITS_BEHIND:-0}" -gt 0 ] 2>/dev/null; then
              echo "=== State: BEHIND ==="
              echo "Base branch is ahead of PR head by $COMMITS_BEHIND commits - will rebase"
              PR_ANALYSIS_STATE=BEHIND
            elif [ "$MERGEABLE" = "MERGEABLE" ]; then
              echo "=== State: CURRENT ==="
              echo "PR is mergeable and up to date - proceeding to auto-merge"
              PR_ANALYSIS_STATE=CURRENT
            else
              echo "=== State: UNKNOWN ==="
              echo "PR mergeability is pending but branch is up to date - skipping"
              PR_ANALYSIS_STATE=UNKNOWN
            fi
          elif [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "=== State: CONFLICTING ==="
            echo "PR has merge conflicts"
            PR_ANALYSIS_STATE=CONFLICTING
          else
            echo "=== State: UNKNOWN ==="
            echo "Cannot determine PR state reliably (mergeable: $MERGEABLE)"
            PR_ANALYSIS_STATE=UNKNOWN
          fi
          
          # Record decision for next steps
          echo "PR_ANALYSIS_STATE=$PR_ANALYSIS_STATE" >> $GITHUB_OUTPUT

      - name: Update branch if behind
        if: steps.analyze.outputs.PR_ANALYSIS_STATE == 'BEHIND'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="$PR_NUMBER"
          
          echo "=== Updating PR branch ==="
          echo "Requesting rebase of PR #$PR onto base branch..."
          
          # Attempt to update branch using gh pr update-branch --rebase
          # This does NOT resolve conflicts, only rebases if possible
          if gh pr update-branch "$PR" --repo "$GITHUB_REPOSITORY" --rebase 2>&1 | tee /tmp/gh-update.log; then
            echo "Branch update command succeeded"
            
            # Verify the update by re-fetching PR state
            sleep 3
            
            NEW_MERGEABLE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')
            echo "After update, mergeable status: $NEW_MERGEABLE"
            
            if [ "$NEW_MERGEABLE" = "MERGEABLE" ]; then
              echo "Branch update succeeded - PR is now current"
              echo "SET_STATE=CURRENT" >> $GITHUB_OUTPUT
            elif [ "$NEW_MERGEABLE" = "CONFLICTING" ]; then
              echo "Branch update completed but PR has conflicts"
              echo "SET_STATE=CONFLICTING" >> $GITHUB_OUTPUT
            else
              echo "Mergeability still pending ($NEW_MERGEABLE) - will re-analyze on next synchronize"
              echo "SET_STATE=UNKNOWN" >> $GITHUB_OUTPUT
            fi
          else
            echo "Branch update failed - checking reason..."
            
            # Re-check state after failed update attempt
            MERGEABLE_AFTER=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')
            echo "Mergeable status after failed update: $MERGEABLE_AFTER"
            
            if [ "$MERGEABLE_AFTER" = "CONFLICTING" ]; then
              echo "PR has conflicts"
              echo "SET_STATE=CONFLICTING" >> $GITHUB_OUTPUT
            elif [ "$MERGEABLE_AFTER" = "MERGEABLE" ]; then
              echo "PR is current despite failed update attempt"
              echo "SET_STATE=CURRENT" >> $GITHUB_OUTPUT
            else
              echo "PR state unclear after failed update ($MERGEABLE_AFTER)"
              echo "SET_STATE=UNKNOWN" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Request Dependabot rebase for conflicting PR
        if: steps.analyze.outputs.PR_ANALYSIS_STATE == 'CONFLICTING' || steps.analyze.outputs.SET_STATE == 'CONFLICTING'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="$PR_NUMBER"
          USER="$PR_USER"
          
          echo "=== Requesting Dependabot rebase ==="
          
          # Only Dependabot PRs can use @dependabot rebase
          # Renovate PRs use @renovate regenerate
          if [[ "$USER" == "dependabot[bot]" || "$USER" == "dependabot-preview[bot]" ]]; then
            echo "Dependabot PR detected. Posting @dependabot rebase request..."
            
            # Use gh pr comment to post the rebase request
            if gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "@dependabot rebase" 2>&1; then
              echo "Successfully posted @dependabot rebase request"
            else
              echo "Warning: Failed to post @dependabot rebase request"
              echo "Consider checking if GITHUB_TOKEN has PR write permissions"
              echo "REBASE_COMMENT_FAILED=true" >> $GITHUB_ENV
            fi
          elif [[ "$USER" == "renovate[bot]" ]]; then
            echo "Renovate PR detected. Posting @renovate regenerate request..."
            
            if gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "@renovate regenerate" 2>&1; then
              echo "Successfully posted @renovate regenerate request"
            else
              echo "Warning: Failed to post @renovate regenerate request"
            fi
          else
            echo "Unrecognized bot user: $USER. Cannot auto-request rebase."
            echo "NOTE: GITHUB_TOKEN may not have permission to comment on PRs from non-workflow bots."
            echo "To enable this, consider adding a workflow-specific token in secrets."
          fi

      - name: Enable auto-merge if PR is current
        if: steps.analyze.outputs.PR_ANALYSIS_STATE == 'CURRENT' || steps.analyze.outputs.SET_STATE == 'CURRENT'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR="$PR_NUMBER"
          URL="$PR_URL"
          
          echo "=== Enabling auto-merge ==="
          
          # Final verification before enabling auto-merge
          FINAL_STATE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,mergeable --jq '.state')
          FINAL_MERGEABLE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeable --jq '.mergeable')
          
          echo "Final PR state: $FINAL_STATE"
          echo "Final mergeable status: $FINAL_MERGEABLE"
          
          if [ "$FINAL_MERGEABLE" = "MERGEABLE" ] && [ "$FINAL_STATE" = "OPEN" ]; then
            echo "PR is mergeable and open. Enabling auto-merge..."
            
            # Enable squash auto-merge
            # This respects required checks and branch protection
            if gh pr merge --auto --squash "$URL"; then
              echo "Auto-merge enabled successfully"
            else
              echo "Warning: Failed to enable auto-merge"
              echo "PR may have become unmergeable between checks"
            fi
          elif [ "$FINAL_MERGEABLE" = "CONFLICTING" ]; then
            echo "PR is not mergeable (conflicts). Auto-merge skipped."
            echo "Dependabot/renovate has been requested to rebase."
          else
            echo "PR state is $FINAL_STATE. Auto-merge skipped."
            echo "Possible reasons: PR is closed, merged, or draft"
          fi

      - name: Log final status
        run: |
          echo "=== Workflow execution complete ==="
          echo "PR: ${{ github.event.pull_request.html_url }}"
          echo "Initial state: ${{ steps.analyze.outputs.PR_ANALYSIS_STATE }}"
          echo "After update: ${{ steps.analyze.outputs.SET_STATE || 'unchanged' }}"
          echo "Action taken: See previous steps"
