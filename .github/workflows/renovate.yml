name: Renovate

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      baseBranch:
        description: "Base branch to update"
        required: false
        default: "main"
        type: choice
        options:
          - main

env:
  RENOVATE_TOKEN: "${{ secrets.RENOVATE_TOKEN || github.token }}"

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Renovate
        uses: renovatebot/github-action@v45
        with:
          configuration: .github/renovate.json5
          baseBranches: main
          pruneBranches: true
          rebaseConflictedBranches: true
          reuseExistingBranches: true
